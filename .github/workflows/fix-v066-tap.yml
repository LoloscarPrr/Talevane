name: Fix Talevane v0.6.6 tap syntax

on:
  push:
    branches: ["release/v0.6.6"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.6.6
      - name: Apply syntax fix
        run: python3 tools/fix_v066_tap.py
      - name: Commit syntax fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/talevane/reader/ui/TalevaneRoot.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix tap-to-narrate punctuation syntax"
          git push origin HEAD:release/v0.6.6
