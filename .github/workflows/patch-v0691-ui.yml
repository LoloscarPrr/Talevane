name: Patch Talevane v0.6.9.1 UI

on:
  push:
    branches: ["release/v0.6.9.1"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.6.9.1
      - name: Apply UI version patch
        run: python3 tools/patch_v0691_ui.py
      - name: Commit UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/talevane/reader/ui/TalevaneRoot.kt
          git diff --cached --quiet && exit 0
          git commit -m "Show Talevane v0.6.9.1 in library"
          git push origin HEAD:release/v0.6.9.1
