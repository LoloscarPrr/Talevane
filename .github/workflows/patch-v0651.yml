name: Patch Talevane v0.6.5.1

on:
  push:
    branches: ["release/v0.6.5.1"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.6.5.1
      - name: Apply v0.6.5.1 hotfix
        run: python3 tools/patch_v0651.py
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/talevane/reader/speech/NarrationService.kt \
                  app/src/main/java/app/talevane/reader/audio/AmbientSoundEngine.kt \
                  app/src/main/java/app/talevane/reader/speech/VoiceQualityHeuristics.kt \
                  app/src/main/java/app/talevane/reader/speech/VoicePreferences.kt \
                  app/build.gradle.kts \
                  app/src/main/java/app/talevane/reader/ui/TalevaneRoot.kt \
                  README.md PRODUCT_BIBLE.md
          git diff --cached --quiet && exit 0
          git commit -m "Talevane v0.6.5.1 audio balance hotfix"
          git push origin HEAD:release/v0.6.5.1
