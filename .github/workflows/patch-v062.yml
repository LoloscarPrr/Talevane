name: Prepare Talevane v0.6.2

on:
  push:
    branches: ["release/v0.6.2"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v0.6.2

      - name: Apply patch
        run: python3 tools/patch_v062.py

      - name: Commit v0.6.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Talevane v0.6.2 Voice Lab"
          git push origin HEAD:release/v0.6.2
