name: Prepare Talevane v0.6.2

on:
  push:
    branches: ["release/v0.6.2"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v0.6.2

      - name: Apply source-only patch
        run: |
          cp tools/patch_v062.py /tmp/patch_v062.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/patch_v062.py')
          text = p.read_text()
          start = text.find("build_workflow = Path('.github/workflows/build-talevane-from-zip.yml')")
          if start >= 0:
              end = text.find("\nreadme = Path('README.md')", start)
              text = text[:start] + text[end + 1:]
          text = text.replace("\nPath('.github/workflows/patch-v062.yml').unlink(missing_ok=True)", "")
          text = text.replace("\nPath('tools/patch_v062.py').unlink(missing_ok=True)", "")
          p.write_text(text)
          PY
          python3 /tmp/patch_v062.py

      - name: Commit v0.6.2 source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md PRODUCT_BIBLE.md
          git commit -m "Talevane v0.6.2 Voice Lab"
          git push origin HEAD:release/v0.6.2
