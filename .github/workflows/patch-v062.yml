name: Prepare Talevane v0.6.2

on:
  push:
    branches: ["release/v0.6.2"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/v0.6.2

      - name: Apply v0.6.2 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          voice_preferences = r'''package app.talevane.reader.speech

import android.content.Context
import android.speech.tts.TextToSpeech
import android.speech.tts.Voice
import java.text.Normalizer


enum class VoiceMode(val label: String, val shortLabel: String) {
    AUTO("Automática", "Auto"),
    MASCULINE("Masculina", "Masc."),
    FEMININE("Femenina", "Fem."),
    SYSTEM("Sistema", "Sistema")
}

object VoicePreferenceStore {
    private const val PREFS = "talevane_voice_preferences"

    private fun modeKey(bookId: Long) = "book_${bookId}_mode"
    private fun voiceKey(bookId: Long, mode: VoiceMode) = "book_${bookId}_voice_${mode.name}"

    fun get(context: Context, bookId: Long): VoiceMode {
        val raw = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
            .getString(modeKey(bookId), VoiceMode.AUTO.name)
        return runCatching { VoiceMode.valueOf(raw ?: VoiceMode.AUTO.name) }
            .getOrDefault(VoiceMode.AUTO)
    }

    fun set(context: Context, bookId: Long, mode: VoiceMode) {
        context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
            .edit()
            .putString(modeKey(bookId), mode.name)
            .apply()
    }

    fun setVoice(context: Context, bookId: Long, mode: VoiceMode, voiceName: String) {
        require(mode == VoiceMode.MASCULINE || mode == VoiceMode.FEMININE)
        context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
            .edit()
            .putString(modeKey(bookId), mode.name)
            .putString(voiceKey(bookId, mode), voiceName)
            .apply()
    }

    fun selectedVoice(context: Context, bookId: Long, mode: VoiceMode): String? {
        if (mode != VoiceMode.MASCULINE && mode != VoiceMode.FEMININE) return null
        return context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
            .getString(voiceKey(bookId, mode), null)
    }
}

data class VoiceProfileResult(
    val requested: VoiceMode,
    val effective: VoiceMode,
    val label: String,
    val voiceName: String? = null
)

object AuthorVoiceProfile {
    private val masculineNames = setOf(
        "albert", "fedor", "fyodor", "gabriel", "miguel", "jose", "jorge", "julio", "pablo",
        "franz", "george", "ernest", "leo", "lev", "victor", "charles", "jules", "william",
        "oscar", "friedrich", "arthur", "hermann", "haruki", "stephen", "mark", "antoine",
        "robert", "john", "james", "edgar", "anton", "alexandre", "alejandro", "carlos"
    )

    private val feminineNames = setOf(
        "virginia", "jane", "mary", "agatha", "gabriela", "isabel", "emily", "charlotte",
        "simone", "ursula", "margaret", "toni", "sylvia", "silvia", "louisa", "clarice",
        "elena", "rosa", "alice", "anne", "george sand", "octavia", "joan", "j k", "jk"
    )

    private val femalePattern = Regex("(^|[^a-z])(female|fem|mujer|woman)([^a-z]|$)")
    private val malePattern = Regex("(^|[^a-z])(male|mascul|hombre|man)([^a-z]|$)")

    fun infer(author: String): VoiceMode {
        val normalized = normalize(author)
        if (normalized.isBlank() || normalized.contains("autor desconocido")) return VoiceMode.SYSTEM
        if (feminineNames.any { name -> normalized == name || normalized.startsWith("$name ") || normalized.contains(" $name ") }) {
            return VoiceMode.FEMININE
        }
        if (masculineNames.any { name -> normalized == name || normalized.startsWith("$name ") || normalized.contains(" $name ") }) {
            return VoiceMode.MASCULINE
        }
        return VoiceMode.SYSTEM
    }

    fun detectedGender(voice: Voice): VoiceMode? {
        val searchable = buildString {
            append(voice.name.lowercase())
            voice.features?.forEach { append(' ').append(it.lowercase()) }
        }
        // Important: check FEMALE first and use token boundaries. The old code searched for
        // "male" as a substring, which also matches the word "female".
        if (femalePattern.containsMatchIn(searchable)) return VoiceMode.FEMININE
        if (malePattern.containsMatchIn(searchable)) return VoiceMode.MASCULINE
        return null
    }

    fun apply(
        context: Context,
        engine: TextToSpeech,
        defaultVoice: Voice?,
        requested: VoiceMode,
        author: String,
        bookId: Long
    ): VoiceProfileResult {
        val effective = if (requested == VoiceMode.AUTO) infer(author) else requested
        if (defaultVoice != null) engine.voice = defaultVoice
        engine.setPitch(1.0f)

        if (effective == VoiceMode.MASCULINE || effective == VoiceMode.FEMININE) {
            val savedName = VoicePreferenceStore.selectedVoice(context, bookId, effective)
            val savedVoice = savedName?.let { name -> engine.voices?.firstOrNull { it.name == name } }
            if (savedVoice != null) {
                engine.voice = savedVoice
                val base = if (effective == VoiceMode.MASCULINE) "masculina" else "femenina"
                val label = if (requested == VoiceMode.AUTO) "Auto · $base elegida" else "${base.replaceFirstChar { it.uppercase() }} · elegida"
                return VoiceProfileResult(requested, effective, label, savedVoice.name)
            }

            val tagged = selectTaggedVoice(engine, effective)
            if (tagged != null) {
                engine.voice = tagged
                val base = if (effective == VoiceMode.MASCULINE) "masculina" else "femenina"
                val label = if (requested == VoiceMode.AUTO) "Auto · $base detectada" else "${base.replaceFirstChar { it.uppercase() }} · detectada"
                return VoiceProfileResult(requested, effective, label, tagged.name)
            }

            // Last resort only. This is intentionally subtle and is labelled as approximate;
            // pitch alone cannot turn one speaker into another speaker.
            engine.setPitch(if (effective == VoiceMode.MASCULINE) 0.96f else 1.04f)
            val base = if (effective == VoiceMode.MASCULINE) "masculina" else "femenina"
            val label = if (requested == VoiceMode.AUTO) "Auto · $base aproximada" else "${base.replaceFirstChar { it.uppercase() }} · aproximada"
            return VoiceProfileResult(requested, effective, label, defaultVoice?.name)
        }

        val label = if (requested == VoiceMode.AUTO) "Auto · sistema" else "Sistema"
        return VoiceProfileResult(requested, effective, label, defaultVoice?.name)
    }

    private fun selectTaggedVoice(engine: TextToSpeech, target: VoiceMode): Voice? {
        val currentLanguage = engine.voice?.locale?.language
        return engine.voices
            ?.asSequence()
            ?.filter { currentLanguage == null || it.locale.language == currentLanguage }
            ?.filter { detectedGender(it) == target }
            ?.sortedWith(compareBy<Voice> { it.isNetworkConnectionRequired }.thenByDescending { it.quality })
            ?.firstOrNull()
    }

    private fun normalize(value: String): String {
        val decomposed = Normalizer.normalize(value.lowercase(), Normalizer.Form.NFD)
        return decomposed
            .replace(Regex("\\p{Mn}+"), "")
            .replace(Regex("[^a-z0-9 ]+"), " ")
            .replace(Regex("\\s+"), " ")
            .trim()
    }
}
'''

          narration_client = r'''package app.talevane.reader.speech

import android.app.Activity
import android.content.Context
import android.content.Intent
import androidx.core.content.ContextCompat

object NarrationClient {
    fun start(context: Context, bookId: Long, position: Int, rate: Float) {
        val intent = Intent(context, NarrationService::class.java)
            .setAction(NarrationService.ACTION_START)
            .putExtra(NarrationService.EXTRA_BOOK_ID, bookId)
            .putExtra(NarrationService.EXTRA_POSITION, position)
            .putExtra(NarrationService.EXTRA_RATE, rate)
        ContextCompat.startForegroundService(context, intent)
    }

    fun pause(context: Context) = send(context, NarrationService.ACTION_PAUSE)
    fun resume(context: Context) = send(context, NarrationService.ACTION_RESUME)
    fun stop(context: Context) = send(context, NarrationService.ACTION_STOP)

    fun setRate(context: Context, rate: Float) {
        context.startService(
            Intent(context, NarrationService::class.java)
                .setAction(NarrationService.ACTION_SET_RATE)
                .putExtra(NarrationService.EXTRA_RATE, rate)
        )
    }

    fun setAmbientVolume(context: Context, volume: Float) {
        context.startService(
            Intent(context, NarrationService::class.java)
                .setAction(NarrationService.ACTION_SET_AMBIENT_VOLUME)
                .putExtra(NarrationService.EXTRA_AMBIENT_VOLUME, volume.coerceIn(0f, 1f))
        )
    }

    fun setVoiceMode(context: Context, bookId: Long, mode: VoiceMode) {
        VoicePreferenceStore.set(context, bookId, mode)
        if (mode == VoiceMode.MASCULINE || mode == VoiceMode.FEMININE) {
            // Pause narration so voice samples from the lab never overlap the book.
            runCatching { pause(context) }
            val lab = Intent(context, VoiceLabActivity::class.java)
                .putExtra(VoiceLabActivity.EXTRA_BOOK_ID, bookId)
                .putExtra(VoiceLabActivity.EXTRA_MODE, mode.name)
            if (context !is Activity) lab.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
            context.startActivity(lab)
            return
        }
        sendVoiceMode(context, bookId, mode)
    }

    fun chooseVoice(context: Context, bookId: Long, mode: VoiceMode, voiceName: String) {
        VoicePreferenceStore.setVoice(context, bookId, mode, voiceName)
        sendVoiceMode(context, bookId, mode)
    }

    private fun sendVoiceMode(context: Context, bookId: Long, mode: VoiceMode) {
        context.startService(
            Intent(context, NarrationService::class.java)
                .setAction(NarrationService.ACTION_SET_VOICE_MODE)
                .putExtra(NarrationService.EXTRA_BOOK_ID, bookId)
                .putExtra(NarrationService.EXTRA_VOICE_MODE, mode.name)
        )
    }

    fun query(context: Context) {
        context.startService(
            Intent(context, NarrationService::class.java)
                .setAction(NarrationService.ACTION_QUERY)
        )
    }

    private fun send(context: Context, action: String) {
        context.startService(Intent(context, NarrationService::class.java).setAction(action))
    }
}
'''

          voice_lab = r'''package app.talevane.reader.speech

import android.os.Bundle
import android.speech.tts.TextToSpeech
import android.speech.tts.Voice
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.compose.foundation.layout.*
import androidx.compose.foundation.lazy.LazyColumn
import androidx.compose.foundation.lazy.items
import androidx.compose.material.icons.Icons
import androidx.compose.material.icons.filled.ArrowBack
import androidx.compose.material.icons.filled.Check
import androidx.compose.material.icons.filled.PlayArrow
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.text.font.FontWeight
import androidx.compose.ui.text.style.TextOverflow
import androidx.compose.ui.unit.dp
import java.util.Locale

private data class VoiceOption(
    val voice: Voice,
    val title: String,
    val subtitle: String,
    val detectedMode: VoiceMode?
)

class VoiceLabActivity : ComponentActivity() {
    companion object {
        const val EXTRA_BOOK_ID = "voice_lab_book_id"
        const val EXTRA_MODE = "voice_lab_mode"
    }

    private var tts: TextToSpeech? = null
    private val options = mutableStateListOf<VoiceOption>()
    private var ready by mutableStateOf(false)
    private var error by mutableStateOf<String?>(null)
    private var bookId: Long = -1L
    private var desiredMode: VoiceMode = VoiceMode.MASCULINE
    private var selectedVoiceName by mutableStateOf<String?>(null)

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        bookId = intent.getLongExtra(EXTRA_BOOK_ID, -1L)
        desiredMode = intent.getStringExtra(EXTRA_MODE)?.let { raw ->
            runCatching { VoiceMode.valueOf(raw) }.getOrNull()
        } ?: VoiceMode.MASCULINE

        if (bookId < 0 || (desiredMode != VoiceMode.MASCULINE && desiredMode != VoiceMode.FEMININE)) {
            finish()
            return
        }

        selectedVoiceName = VoicePreferenceStore.selectedVoice(this, bookId, desiredMode)

        setContent {
            MaterialTheme(colorScheme = darkColorScheme()) {
                VoiceLabScreen(
                    mode = desiredMode,
                    ready = ready,
                    error = error,
                    options = options,
                    selectedVoiceName = selectedVoiceName,
                    onBack = { finish() },
                    onPreview = ::preview,
                    onSelect = ::selectVoice
                )
            }
        }

        tts = TextToSpeech(applicationContext) { status ->
            if (status != TextToSpeech.SUCCESS) {
                error = "No se pudo iniciar el motor de voz del teléfono."
                ready = true
                return@TextToSpeech
            }
            loadVoices()
        }
    }

    private fun loadVoices() {
        val engine = tts ?: return
        val all = engine.voices.orEmpty().distinctBy { it.name }
        val spanish = all.filter { it.locale.language.equals("es", ignoreCase = true) }
        val source = if (spanish.isNotEmpty()) spanish else all.filter {
            it.locale.language == Locale.getDefault().language
        }

        if (source.isEmpty()) {
            error = "El motor TTS no informó voces compatibles. Puedes instalar otras voces desde los ajustes de texto a voz de Android."
            ready = true
            return
        }

        val sorted = source.sortedWith(
            compareByDescending<Voice> { AuthorVoiceProfile.detectedGender(it) == desiredMode }
                .thenBy { it.isNetworkConnectionRequired }
                .thenByDescending { it.quality }
                .thenBy { it.locale.toLanguageTag() }
                .thenBy { it.name }
        )

        val counters = mutableMapOf<String, Int>()
        options.clear()
        sorted.forEach { voice ->
            val localeTag = voice.locale.toLanguageTag()
            val index = (counters[localeTag] ?: 0) + 1
            counters[localeTag] = index
            val displayLocale = localeTitle(voice.locale)
            val connection = if (voice.isNetworkConnectionRequired) "requiere internet" else "offline"
            val quality = when {
                voice.quality >= Voice.QUALITY_VERY_HIGH -> "calidad muy alta"
                voice.quality >= Voice.QUALITY_HIGH -> "calidad alta"
                else -> "calidad estándar"
            }
            options += VoiceOption(
                voice = voice,
                title = "$displayLocale · Voz $index",
                subtitle = "$connection · $quality",
                detectedMode = AuthorVoiceProfile.detectedGender(voice)
            )
        }
        ready = true
    }

    private fun localeTitle(locale: Locale): String {
        val spanishLocale = Locale("es")
        val language = locale.getDisplayLanguage(spanishLocale)
            .replaceFirstChar { if (it.isLowerCase()) it.titlecase(spanishLocale) else it.toString() }
        val country = locale.getDisplayCountry(spanishLocale)
        return if (country.isBlank()) language else "$language ($country)"
    }

    private fun preview(option: VoiceOption) {
        val engine = tts ?: return
        engine.stop()
        engine.voice = option.voice
        engine.setPitch(1.0f)
        engine.setSpeechRate(1.0f)
        engine.speak(
            "Esta es una muestra de voz de Talevane. Puedes escucharla antes de elegir.",
            TextToSpeech.QUEUE_FLUSH,
            null,
            "talevane-voice-preview"
        )
    }

    private fun selectVoice(option: VoiceOption) {
        tts?.stop()
        selectedVoiceName = option.voice.name
        NarrationClient.chooseVoice(this, bookId, desiredMode, option.voice.name)
        setResult(RESULT_OK)
        finish()
    }

    override fun onDestroy() {
        tts?.stop()
        tts?.shutdown()
        tts = null
        super.onDestroy()
    }
}

@OptIn(ExperimentalMaterial3Api::class)
@Composable
private fun VoiceLabScreen(
    mode: VoiceMode,
    ready: Boolean,
    error: String?,
    options: List<VoiceOption>,
    selectedVoiceName: String?,
    onBack: () -> Unit,
    onPreview: (VoiceOption) -> Unit,
    onSelect: (VoiceOption) -> Unit
) {
    val desiredLabel = if (mode == VoiceMode.MASCULINE) "masculina" else "femenina"
    Scaffold(
        topBar = {
            TopAppBar(
                title = { Text("Laboratorio de voz") },
                navigationIcon = {
                    IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, "Volver") }
                }
            )
        }
    ) { padding ->
        Column(Modifier.fillMaxSize().padding(padding)) {
            Column(Modifier.padding(horizontal = 20.dp, vertical = 12.dp)) {
                Text("Elige una voz $desiredLabel", style = MaterialTheme.typography.headlineSmall)
                Spacer(Modifier.height(6.dp))
                Text(
                    "Estas son voces reales que informó el motor TTS de tu teléfono. Android no siempre indica su sexo, así que puedes escucharlas antes de guardar una para este libro.",
                    color = MaterialTheme.colorScheme.onSurfaceVariant
                )
            }

            if (!ready) {
                Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                    CircularProgressIndicator()
                }
                return@Column
            }

            error?.let { message ->
                Card(Modifier.fillMaxWidth().padding(horizontal = 20.dp, vertical = 8.dp)) {
                    Text(message, Modifier.padding(16.dp), color = MaterialTheme.colorScheme.onSurfaceVariant)
                }
            }

            if (options.isNotEmpty()) {
                LazyColumn(
                    Modifier.fillMaxSize().padding(horizontal = 16.dp),
                    verticalArrangement = Arrangement.spacedBy(10.dp),
                    contentPadding = PaddingValues(bottom = 24.dp)
                ) {
                    items(options, key = { it.voice.name }) { option ->
                        val selected = option.voice.name == selectedVoiceName
                        ElevatedCard(Modifier.fillMaxWidth()) {
                            Column(Modifier.fillMaxWidth().padding(14.dp)) {
                                Row(verticalAlignment = Alignment.CenterVertically) {
                                    Column(Modifier.weight(1f)) {
                                        Text(option.title, fontWeight = FontWeight.SemiBold)
                                        Text(option.subtitle, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                        Text(option.voice.name, style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onSurfaceVariant, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                    }
                                    if (selected) Icon(Icons.Default.Check, "Voz seleccionada", tint = MaterialTheme.colorScheme.primary)
                                }
                                option.detectedMode?.let { detected ->
                                    Spacer(Modifier.height(8.dp))
                                    AssistChip(
                                        onClick = {},
                                        label = { Text(if (detected == VoiceMode.MASCULINE) "Masculina identificada por el motor" else "Femenina identificada por el motor") }
                                    )
                                }
                                Spacer(Modifier.height(10.dp))
                                Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                    OutlinedButton(onClick = { onPreview(option) }) {
                                        Icon(Icons.Default.PlayArrow, null)
                                        Spacer(Modifier.width(4.dp))
                                        Text("Probar")
                                    }
                                    Button(onClick = { onSelect(option) }, enabled = !selected) {
                                        Text(if (selected) "Seleccionada" else "Usar esta voz")
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}
'''

