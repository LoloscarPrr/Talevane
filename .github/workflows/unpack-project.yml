name: Unpack Talevane project sources

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/unpack-project.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Android project into repository
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(ls -1t Talevane_v*_UPLOAD_THIS*.zip 2>/dev/null | head -n 1 || true)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No Talevane upload ZIP found."
            exit 1
          fi
          rm -rf extracted
          unzip -q "$ZIP_FILE" -d extracted
          cp -R extracted/. .
          rm -rf extracted

      - name: Commit unpacked sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Unpack Android project sources [skip ci]"
          git push origin HEAD:main
