name: Apply BookFlow v0.7 reader

on:
  push:
    branches: ["feat/v0.7.0-bookflow-reader"]

permissions:
  contents: write

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply BookFlow reader migration
        run: python scripts/apply_v070_bookflow.py

      - name: Commit migrated reader
        run: |
          rm scripts/apply_v070_bookflow.py
          rm .github/workflows/apply-v070-bookflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "BookFlow v0.7.0 — paged graphite reader"
          git push origin HEAD:feat/v0.7.0-bookflow-reader

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: BookFlow-v0.7.0-preview
          path: app/build/outputs/apk/debug/app-debug.apk
