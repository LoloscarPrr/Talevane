name: Limpieza de emergencia de artifacts

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-artifacts.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Eliminar todos los artifacts actuales
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          IDS="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id')"
          if [ -z "$IDS" ]; then
            echo "No hay artifacts para borrar."
            exit 0
          fi
          COUNT=0
          while IFS= read -r ID; do
            [ -z "$ID" ] && continue
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}"
            COUNT=$((COUNT + 1))
          done <<< "$IDS"
          echo "Artifacts eliminados: $COUNT"
