name: Patch Talevane v0.6.7

on:
  push:
    branches: ["release/v0.6.7"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.6.7
      - name: Apply v0.6.7 integration
        run: python3 tools/patch_v067.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/talevane/reader/speech/NarrationService.kt \
                  app/src/main/java/app/talevane/reader/ui/TalevaneRoot.kt \
                  app/src/main/java/app/talevane/reader/speech/VoiceLabActivity.kt \
                  app/build.gradle.kts \
                  .github/workflows/build-talevane-from-zip.yml \
                  README.md PRODUCT_BIBLE.md
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Talevane v0.6.7 Guided Reading"
          git push origin HEAD:release/v0.6.7
