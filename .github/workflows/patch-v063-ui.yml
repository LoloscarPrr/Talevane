name: Patch Talevane v0.6.3 UI

on:
  push:
    branches: ["release/v0.6.3"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.6.3
      - name: Update visible soundtrack labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/app/talevane/reader/ui/TalevaneRoot.kt')
          s = p.read_text()
          s = s.replace('Text("v0.6.2"', 'Text("v0.6.3"')
          s = s.replace('"Ambiente · ${moodSnapshot.mood.label} · sonando"', '"Música · ${moodSnapshot.mood.label} · sonando"')
          s = s.replace('"Ambiente · ${moodSnapshot.mood.label}"', '"Música · ${moodSnapshot.mood.label}"')
          s = s.replace('"Bajar ambiente"', '"Volumen de música"')
          p.write_text(s)
          PY
      - name: Commit UI labels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/talevane/reader/ui/TalevaneRoot.kt
          git diff --cached --quiet && exit 0
          git commit -m "Update v0.6.3 soundtrack UI labels"
          git push origin HEAD:release/v0.6.3
