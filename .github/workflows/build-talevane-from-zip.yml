name: Build Talevane APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "feat/v0.6.9.7-safe-spelling"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.6.9.7 safe spelling patch
        if: github.ref == 'refs/heads/feat/v0.6.9.7-safe-spelling' && github.actor != 'github-actions[bot]'
        run: python scripts/apply_v0697.py

      - name: Commit v0.6.9.7 patch
        if: github.ref == 'refs/heads/feat/v0.6.9.7-safe-spelling' && github.actor != 'github-actions[bot]'
        run: |
          rm scripts/apply_v0697.py
          git show origin/main:.github/workflows/build-talevane-from-zip.yml > .github/workflows/build-talevane-from-zip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Talevane v0.6.9.7 — safe narration spelling correction"
          git push origin HEAD:feat/v0.6.9.7-safe-spelling

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Talevane-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
