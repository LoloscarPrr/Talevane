name: Build Talevane APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable Talevane signing key
        env:
          TALEVANE_KEYSTORE_B64: ${{ secrets.TALEVANE_KEYSTORE_B64 }}
        run: |
          if [ -n "$TALEVANE_KEYSTORE_B64" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/talevane-update-key.p12"
            printf '%s' "$TALEVANE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            echo "TALEVANE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "Stable signing key restored."
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Stable signing secret not available; PR will compile with temporary debug signing only."
          else
            echo "Missing required repository secret TALEVANE_KEYSTORE_B64. Refusing to publish an APK with a different signature."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Read Talevane version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read Talevane version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Talevane v$VERSION"

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/Talevane-v${VERSION}.apk"
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Talevane-v${{ steps.version.outputs.version }}-APK
          path: output/Talevane-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="talevane-v${VERSION}"
          APK="output/Talevane-v${VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Talevane v${VERSION}" \
              --notes "APK automático de Talevane v${VERSION}. Compilado y probado por GitHub Actions."
          fi
