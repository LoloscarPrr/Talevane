name: Build Talevane APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable Talevane signing key
        env:
          TALEVANE_KEYSTORE_B64: ${{ secrets.TALEVANE_KEYSTORE_B64 }}
        run: |
          if [ -n "$TALEVANE_KEYSTORE_B64" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/talevane-update-key.p12"
            printf '%s' "$TALEVANE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            echo "TALEVANE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "Stable signing key restored."
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Stable signing secret not available; PR will compile with temporary debug signing only."
          else
            echo "Missing required repository secret TALEVANE_KEYSTORE_B64. Refusing to publish an APK with a different signature."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Talevane-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
