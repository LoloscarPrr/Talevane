name: Build Talevane APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Talevane project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(ls -1t Talevane_v*_UPLOAD_THIS*.zip 2>/dev/null | head -n 1 || true)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No Talevane upload ZIP found in repository root."
            exit 1
          fi
          echo "Using $ZIP_FILE"
          rm -rf extracted
          unzip -q "$ZIP_FILE" -d extracted
          cp -R extracted/. .

      - name: Opt in to Material 3 experimental API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/app/talevane/reader/ui/TalevaneRoot.kt")
          if not path.exists():
              raise SystemExit(f"Expected Kotlin source not found: {path}")

          text = path.read_text(encoding="utf-8")
          annotation = "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n\n"
          if not text.startswith(annotation):
              path.write_text(annotation + text, encoding="utf-8")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Talevane-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
