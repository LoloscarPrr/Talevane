name: Patch Talevane v0.6.4.2 Narration

on:
  push:
    branches: ["release/v0.6.4.2"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.6.4.2
      - name: Apply narration patch
        run: python3 tools/patch_v0642_narration.py
      - name: Commit narration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/talevane/reader/speech/NarrationService.kt app/src/main/java/app/talevane/reader/ui/TalevaneRoot.kt
          git diff --cached --quiet && exit 0
          git commit -m "Naturalize PDF narration line breaks"
          git push origin HEAD:release/v0.6.4.2
