name: Patch Talevane v0.6.8 Ensemble

on:
  push:
    branches: ["release/v0.6.8"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.6.8
      - name: Apply ensemble refinement
        run: python3 tools/patch_v068_ensemble.py
      - name: Commit ensemble refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/app/talevane/reader/audio/MidiPianoLibrary.kt app/src/main/java/app/talevane/reader/speech/NarrationService.kt app/src/main/java/app/talevane/reader/ui/TalevaneRoot.kt
          git diff --cached --quiet && exit 0
          git commit -m "Refine v0.6.8 mood ensemble with solo string lead"
          git push origin HEAD:release/v0.6.8
