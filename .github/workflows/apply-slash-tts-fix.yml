name: Apply slash TTS fix

on:
  push:
    branches: ["fix/v0.6.9.6-slash-tts"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/v0.6.9.6-slash-tts
          fetch-depth: 0

      - name: Patch slash-separated words and bump version
        shell: python
        run: |
          from pathlib import Path

          service = Path("app/src/main/java/app/talevane/reader/speech/NarrationService.kt")
          text = service.read_text()

          text = text.replace(
              "if (raw.none { it == '\\n' || it == '\\r' || it == '\\t' }) return raw",
              "if (raw.none { it == '\\n' || it == '\\r' || it == '\\t' || it == '/' }) return raw",
          )

          needle = """            when (raw[i]) {
                '\\t' -> {
"""
          replacement = """            when (raw[i]) {
                '/' -> {
                    val previous = raw.getOrNull(i - 1)
                    val next = raw.getOrNull(i + 1)
                    if (previous?.isLetter() == true && next?.isLetter() == true) {
                        // Some Android TTS engines spell slash-joined words letter by letter.
                        // A comma keeps the exact same string length/range mapping while making
                        // forms like Hombre/Mujer sound like two normal words with a tiny pause.
                        chars[i] = ','
                    }
                    i += 1
                }
                '\\t' -> {
"""
          if needle not in text:
              raise SystemExit("NarrationService slash insertion point was not found")
          text = text.replace(needle, replacement, 1)
          service.write_text(text)

          gradle = Path("app/build.gradle.kts")
          build = gradle.read_text()
          build = build.replace('versionCode = 26', 'versionCode = 27')
          build = build.replace('versionName = "0.6.9.5"', 'versionName = "0.6.9.6"')
          if 'versionName = "0.6.9.6"' not in build:
              raise SystemExit("Expected v0.6.9.5 version was not found")
          gradle.write_text(build)

          Path(".github/workflows/apply-slash-tts-fix.yml").unlink()

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Talevane v0.6.9.6 — normalize slash-separated words for TTS"
          git push origin HEAD:fix/v0.6.9.6-slash-tts
